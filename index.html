<title>Kanji Browser</title>
<style>
  :root {
    --bg: #121216;
    --bg-panel: #1c1c22;
    --kanji: #f5f5f0;
    --text: #e1e1e6;
    --text-dim: #8c8c96;
    --accent: #5aaaff;
    --accent-dim: #3c6496;
    --on: #ffb05a;
    --kun: #78dc96;
    --border: #373741;
    --progress-bg: #282830;
    --warn: #e65a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- top bar ---------- */
  #topbar {
    flex: 0 0 auto;
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px; color: var(--text-dim);
    padding-top: env(safe-area-inset-top);
    height: calc(44px + env(safe-area-inset-top));
  }
  #topbar .menuBtn { color: var(--accent); font-size: 15px; }

  /* ---------- browse screen ---------- */
  #browse { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  #kanjiArea {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    min-height: 0; position: relative;
  }
  #kanjiGlyph {
    font-size: 42vw; line-height: 1; font-weight: 400; color: var(--kanji);
    font-family: "Hiragino Mincho ProN", "Hiragino Kaku Gothic ProN", "Noto Serif CJK JP", "Noto Sans CJK JP", "Hiragino Sans", serif;
  }
  #browse.detail-hidden #kanjiGlyph { font-size: 56vw; }
  #detailPanel {
    flex: 0 0 auto; padding: 10px 18px 6px; border-top: 1px solid var(--border);
    background: var(--bg-panel);
    max-height: 50vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  #browse.detail-hidden #detailPanel { display: none; }
  #meaning { font-size: 21px; font-weight: 600; color: var(--text); margin: 0 0 6px; }
  .readingRow { font-size: 13px; color: var(--text-dim); margin-bottom: 1px; }
  .readingVal.on { color: var(--on); font-size: 16px; }
  .readingVal.kun { color: var(--kun); font-size: 16px; }
  #tags { margin: 8px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11px; color: var(--text-dim); background: var(--progress-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px;
  }
  #mnemonic { font-size: 12px; color: var(--accent-dim); margin-top: 6px; }
  #exampleBlock { margin-top: 8px; }
  #exampleJp {
    font-size: 15px; color: var(--text); margin-bottom: 2px;
    font-family: "Hiragino Mincho ProN", "Hiragino Kaku Gothic ProN", "Noto Serif CJK JP", "Noto Sans CJK JP", "Hiragino Sans", serif;
  }
  #exampleEn { font-size: 12px; color: var(--text-dim); }

  #vocabBlock { margin-top: 10px; }
  .vocabItem { margin-bottom: 6px; }
  .vocabWord {
    font-size: 15px; color: var(--text);
    font-family: "Hiragino Mincho ProN", "Hiragino Kaku Gothic ProN", "Noto Serif CJK JP", "Noto Sans CJK JP", "Hiragino Sans", serif;
  }
  .vocabReading { font-size: 12px; color: var(--text-dim); }
  .vocabMeaning { font-size: 12px; color: var(--text-dim); }

  #bottombar {
    flex: 0 0 auto;
    height: calc(34px + env(safe-area-inset-bottom));
    display: flex; align-items: center;
    justify-content: space-between; padding: 0 16px 4px;
    font-size: 12px; color: var(--text-dim);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #progressWrap { flex: 1; height: 3px; background: var(--progress-bg); margin: 0 12px; border-radius: 2px; overflow: hidden; }
  #progressBar { height: 100%; background: var(--accent); width: 0%; }

  /* edge tap zones (invisible, just for touch targets) */
  .edgeZone { position: absolute; top: 0; bottom: 0; width: 18%; z-index: 2; }
  #edgeLeft { left: 0; } #edgeRight { right: 0; }

  /* ---------- overlay screens (menu / search) ---------- */
  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  .overlay.active { display: flex; }
  .overlayHeader {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .overlayHeader h2 { font-size: 16px; margin: 0; color: var(--text); font-weight: 600; }
  .closeBtn { color: var(--accent); font-size: 15px; padding: 4px 8px; }
  .overlayBody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 14px 16px 30px; }

  .sectionLabel { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 8px; }
  .sectionLabel:first-child { margin-top: 0; }
  .chipRow { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 14px; color: var(--text); background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px;
  }
  .chip.activeChip { border-color: var(--accent); color: var(--accent); }
  .searchBox {
    width: 100%; font-size: 17px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-panel); color: var(--text);
    -webkit-user-select: text; user-select: text;
  }
  .resultRow {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .resultRow .rChar { font-size: 26px; color: var(--kanji); font-family: "Hiragino Mincho ProN", "Noto Serif CJK JP", serif; width: 40px; flex: 0 0 auto; }
  .resultRow .rMeaning { font-size: 14px; color: var(--text); }
  .resultRow .rSub { font-size: 11px; color: var(--text-dim); }
  #noResults { color: var(--text-dim); font-size: 13px; padding: 20px 4px; text-align: center; }

  #errorBox { padding: 30px; color: var(--warn); font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="sortLabel">All (order)</span>
    <span class="menuBtn" id="menuTapZone">&#9776; tap for menu</span>
  </div>

  <div id="browse">
    <div id="kanjiArea">
      <div id="edgeLeft" class="edgeZone"></div>
      <div id="edgeRight" class="edgeZone"></div>
      <div id="kanjiGlyph">&#26085;</div>
    </div>
    <div id="detailPanel">
      <div id="meaning">&nbsp;</div>
      <div class="readingRow">ON'YOMI</div>
      <div class="readingVal on" id="onYomi">&nbsp;</div>
      <div class="readingRow">KUN'YOMI</div>
      <div class="readingVal kun" id="kunYomi">&nbsp;</div>
      <div id="tags"></div>
      <div id="exampleBlock" style="display:none;">
        <div class="readingRow">EXAMPLE</div>
        <div id="exampleJp"></div>
        <div id="exampleEn"></div>
      </div>
      <div id="vocabBlock" style="display:none;">
        <div class="readingRow">USED IN WORDS</div>
        <div id="vocabList"></div>
      </div>
      <div id="mnemonic"></div>
    </div>
    <div id="bottombar">
      <span id="prevLabel">&lsaquo; prev</span>
      <div id="progressWrap"><div id="progressBar"></div></div>
      <span id="posLabel" style="margin-right:10px;">1/1</span>
      <span id="nextLabel">next &rsaquo;</span>
    </div>
  </div>

  <!-- MENU overlay -->
  <div class="overlay" id="menuOverlay">
    <div class="overlayHeader"><h2>Browse Menu</h2><span class="closeBtn" id="menuCloseBtn">Done</span></div>
    <div class="overlayBody">
      <div class="sectionLabel">Sort / Group By</div>
      <div class="chipRow" id="sortChips"></div>
      <div class="sectionLabel">Jump to Grade</div>
      <div class="chipRow" id="gradeChips"></div>
      <div class="sectionLabel">Jump to JLPT</div>
      <div class="chipRow" id="jlptChips"></div>
      <div class="sectionLabel">&nbsp;</div>
      <div class="chipRow"><div class="chip" id="openSearchBtn">&#128269; Search</div></div>
    </div>
  </div>

  <!-- SEARCH overlay -->
  <div class="overlay" id="searchOverlay">
    <div class="overlayHeader"><h2>Search</h2><span class="closeBtn" id="searchCloseBtn">Done</span></div>
    <div class="overlayBody">
      <input class="searchBox" id="searchInput" type="text" placeholder="meaning or reading, e.g. water"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <div id="searchResults" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="errorBox" style="display:none;"></div>
</div>

const SORT_MODES = [
  ["unicode", "All (order)"],
  ["freq", "By Frequency"],
  ["grade", "By Grade"],
  ["jlpt_new", "By JLPT"],
  ["strokes", "By Strokes"]
];

// ---------------- data helpers (mirrors kanji_app/data.py) ----------------
function listField(raw, keys) {
  for (const k of keys) {
    if (raw[k] && raw[k].length) return raw[k];
  }
  return [];
}
function cleanReading(r) { return r.startsWith("!") ? r.slice(1) : r; }
function getMeanings(raw) { return listField(raw, ["meanings", "wk_meanings"]); }
function getOn(raw) { return listField(raw, ["readings_on"]).map(cleanReading); }
function getKun(raw) { return listField(raw, ["readings_kun"]).map(cleanReading); }
function getRadicals(raw) { return listField(raw, ["wk_radicals"]); }

function sortKey(char, raw, mode) {
  if (mode === "unicode") return [0, char];
  const v = raw[mode];
  if (v === undefined || v === null) return [1, char];
  return [0, v, char];
}

const ALL_CHARS = Object.keys(KANJI_DATA).filter(c => [...c].length === 1);

function allCharsSorted(mode) {
  return [...ALL_CHARS].sort((a, b) => {
    const ka = sortKey(a, KANJI_DATA[a], mode);
    const kb = sortKey(b, KANJI_DATA[b], mode);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] < kb[1] ? -1 : 1;
    return 0;
  });
}
function availableGrades() {
  return [...new Set(ALL_CHARS.map(c => KANJI_DATA[c].grade).filter(v => v !== undefined && v !== null))].sort((a,b)=>a-b);
}
function availableJlpt() {
  return [...new Set(ALL_CHARS.map(c => KANJI_DATA[c].jlpt_new).filter(v => v !== undefined && v !== null))].sort((a,b)=>b-a);
}
function searchKanji(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const starts = [], contains = [];
  for (const c of ALL_CHARS) {
    const raw = KANJI_DATA[c];
    const meanings = getMeanings(raw).map(m => m.toLowerCase());
    const readings = [...getOn(raw), ...getKun(raw)].map(r => r.toLowerCase());
    if (c === query) { starts.unshift({c, e: raw}); continue; }
    const hitStart = meanings.some(m => m.startsWith(q));
    const hitContains = meanings.some(m => m.includes(q)) || readings.some(r => r.includes(q));
    if (hitStart) starts.push({c, e: raw});
    else if (hitContains) contains.push({c, e: raw});
  }
  const freqKey = (x) => x.e.freq !== undefined && x.e.freq !== null ? x.e.freq : 99999;
  starts.sort((a,b) => freqKey(a) - freqKey(b));
  contains.sort((a,b) => freqKey(a) - freqKey(b));
  return [...starts, ...contains].map(x => x.c);
}

// ---------------- app state ----------------
const state = {
  screen: "browse",
  sortMode: "unicode",
  viewChars: allCharsSorted("unicode"),
  index: 0,
  showDetail: true,
  searchQuery: "",
  searchResults: []
};

function currentChar() {
  if (!state.viewChars.length) return null;
  state.index = Math.max(0, Math.min(state.index, state.viewChars.length - 1));
  return state.viewChars[state.index];
}
function move(delta) {
  if (!state.viewChars.length) return;
  const n = state.viewChars.length;
  state.index = ((state.index + delta) % n + n) % n;
  renderBrowse();
}
function setSort(mode) {
  const keep = currentChar();
  state.sortMode = mode;
  state.viewChars = allCharsSorted(mode);
  state.index = keep && state.viewChars.includes(keep) ? state.viewChars.indexOf(keep) : 0;
}
function jumpToGroup(field, value) {
  state.sortMode = field;
  state.viewChars = allCharsSorted(field);
  const i = state.viewChars.findIndex(c => KANJI_DATA[c][field] === value);
  state.index = i >= 0 ? i : 0;
}
function gotoChar(char) {
  if (state.viewChars.includes(char)) {
    state.index = state.viewChars.indexOf(char);
  } else {
    state.sortMode = "unicode";
    state.viewChars = allCharsSorted("unicode");
    state.index = state.viewChars.indexOf(char);
  }
  state.showDetail = true;
  closeOverlays();
  renderBrowse();
}

// ---------------- rendering ----------------
const $ = (id) => document.getElementById(id);

function renderBrowse() {
  const char = currentChar();
  const browseEl = $("browse");
  browseEl.classList.toggle("detail-hidden", !state.showDetail);
  $("sortLabel").textContent = (SORT_MODES.find(m => m[0] === state.sortMode) || [null, state.sortMode])[1];
  if (!char) return;
  const raw = KANJI_DATA[char] || {};
  $("kanjiGlyph").textContent = char;
  const meanings = getMeanings(raw);
  $("meaning").textContent = meanings.length ? meanings.join(", ") : "(no meaning data)";
  const onList = getOn(raw), kunList = getKun(raw);
  $("onYomi").textContent = onList.length ? onList.join("、 ") : "—";
  $("kunYomi").textContent = kunList.length ? kunList.join("、 ") : "—";

  const tags = [];
  if (raw.strokes != null) tags.push(raw.strokes + " strokes");
  if (raw.grade != null) tags.push("Grade " + raw.grade);
  if (raw.jlpt_new != null) tags.push("JLPT N" + raw.jlpt_new);
  if (raw.freq != null) tags.push("Freq #" + raw.freq);
  $("tags").innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join("");

  const radicals = getRadicals(raw);
  $("mnemonic").textContent = radicals.length ? "Mnemonic radical: " + radicals.join(", ") : "";

  const example = raw.example;
  if (example && example.jp) {
    $("exampleJp").textContent = example.jp;
    $("exampleEn").textContent = example.en || "";
    $("exampleBlock").style.display = "";
  } else {
    $("exampleBlock").style.display = "none";
  }

  const vocab = raw.vocab;
  if (vocab && vocab.length) {
    $("vocabList").innerHTML = vocab.map(item => `<div class="vocabItem">
      <span class="vocabWord">${escapeHtml(item.word)}</span>
      <span class="vocabReading">（${escapeHtml(item.reading)}）</span>
      <div class="vocabMeaning">${escapeHtml(item.meaning)}</div>
    </div>`).join("");
    $("vocabBlock").style.display = "";
  } else {
    $("vocabBlock").style.display = "none";
  }

  $("posLabel").textContent = (state.index + 1) + "/" + state.viewChars.length;
  $("progressBar").style.width = (100 * (state.index + 1) / state.viewChars.length) + "%";
}

function renderMenu() {
  $("sortChips").innerHTML = SORT_MODES.map(([mode, label]) =>
    `<div class="chip ${mode === state.sortMode ? "activeChip" : ""}" data-sort="${mode}">${label}</div>`
  ).join("");
  $("gradeChips").innerHTML = availableGrades().map(g =>
    `<div class="chip" data-grade="${g}">Grade ${g}</div>`
  ).join("");
  $("jlptChips").innerHTML = availableJlpt().map(l =>
    `<div class="chip" data-jlpt="${l}">N${l}</div>`
  ).join("");
}

function renderSearch() {
  const results = state.searchResults.slice(0, 60);
  if (!state.searchQuery.trim()) {
    $("searchResults").innerHTML = "";
    return;
  }
  if (!results.length) {
    $("searchResults").innerHTML = `<div id="noResults">No matches for "${escapeHtml(state.searchQuery)}"</div>`;
    return;
  }
  $("searchResults").innerHTML = results.map(c => {
    const raw = KANJI_DATA[c];
    const meanings = getMeanings(raw).join(", ");
    const sub = [raw.grade != null ? "Grade " + raw.grade : null, raw.jlpt_new != null ? "N" + raw.jlpt_new : null]
      .filter(Boolean).join(" · ");
    return `<div class="resultRow" data-char="${c}">
      <div class="rChar">${c}</div>
      <div><div class="rMeaning">${escapeHtml(meanings)}</div><div class="rSub">${escapeHtml(sub)}</div></div>
    </div>`;
  }).join("");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function closeOverlays() {
  $("menuOverlay").classList.remove("active");
  $("searchOverlay").classList.remove("active");
  state.screen = "browse";
}
function openMenu() {
  state.screen = "menu";
  renderMenu();
  $("menuOverlay").classList.add("active");
}
function openSearch() {
  state.screen = "search";
  state.searchQuery = "";
  state.searchResults = [];
  $("searchInput").value = "";
  renderSearch();
  $("searchOverlay").classList.add("active");
  setTimeout(() => $("searchInput").focus(), 250);
}

// ---------------- touch handling (tap vs swipe) ----------------
function attachPointerHandling(el, handlers) {
  let sx = 0, sy = 0, st = 0, active = false;
  const TAP_MAX = 12, SWIPE_MIN = 40, SWIPE_MAX_CROSS = 60;
  el.addEventListener("touchstart", (e) => {
    if (e.target.closest("#detailPanel")) { active = false; return; }
    const t = e.changedTouches[0];
    sx = t.clientX; sy = t.clientY; st = Date.now(); active = true;
  }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (!active) return;
    active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < TAP_MAX && Math.abs(dy) < TAP_MAX) {
      handlers.onTap && handlers.onTap(t.clientX, t.clientY, e.target);
    } else if (Math.abs(dx) >= SWIPE_MIN && Math.abs(dy) <= SWIPE_MAX_CROSS) {
      handlers.onSwipe && handlers.onSwipe(dx > 0 ? "right" : "left");
    } else if (Math.abs(dy) >= SWIPE_MIN && Math.abs(dx) <= SWIPE_MAX_CROSS) {
      handlers.onSwipe && handlers.onSwipe(dy > 0 ? "down" : "up");
    }
  }, { passive: true });
}

// ---------------- wire up UI ----------------
attachPointerHandling(document.getElementById("browse"), {
  onTap: (x, y, target) => {
    if (target.closest("#menuTapZone")) { openMenu(); return; }
    if (target.closest("#edgeLeft")) { move(-1); return; }
    if (target.closest("#edgeRight")) { move(1); return; }
    state.showDetail = !state.showDetail;
    renderBrowse();
  },
  onSwipe: (dir) => {
    if (dir === "left") move(1);
    else if (dir === "right") move(-1);
    else if (dir === "up") { state.showDetail = false; renderBrowse(); }
    else if (dir === "down") { state.showDetail = true; renderBrowse(); }
  }
});
$("menuTapZone").addEventListener("click", openMenu);
$("menuCloseBtn").addEventListener("click", closeOverlays);
$("searchCloseBtn").addEventListener("click", closeOverlays);
$("openSearchBtn").addEventListener("click", openSearch);

$("sortChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  setSort(chip.dataset.sort);
  closeOverlays();
  renderBrowse();
});
$("gradeChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  jumpToGroup("grade", Number(chip.dataset.grade));
  state.showDetail = true;
  closeOverlays();
  renderBrowse();
});
$("jlptChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  jumpToGroup("jlpt_new", Number(chip.dataset.jlpt));
  state.showDetail = true;
  closeOverlays();
  renderBrowse();
});
$("searchInput").addEventListener("input", (e) => {
  state.searchQuery = e.target.value;
  state.searchResults = searchKanji(state.searchQuery);
  renderSearch();
});
$("searchResults").addEventListener("click", (e) => {
  const row = e.target.closest(".resultRow");
  if (!row) return;
  gotoChar(row.dataset.char);
});

// prevent iOS Safari's rubber-band scroll/zoom on the app shell
document.addEventListener("touchmove", (e) => {
  if (!e.target.closest(".overlayBody") && !e.target.closest("#detailPanel")) e.preventDefault();
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

// initial paint
try {
  renderBrowse();
} catch (err) {
  document.getElementById("errorBox").style.display = "block";
  document.getElementById("errorBox").textContent = "Failed to load kanji data: " + err;
}
</script>
</body>
</html>
